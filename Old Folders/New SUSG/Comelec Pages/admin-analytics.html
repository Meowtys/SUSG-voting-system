<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics - SUSG Election System</title>
    <link rel="icon" href="../asset/susglogo.png" type="image/png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
    
        body,
        html {
            font-family: 'Poppins', sans-serif;
            background-color: #f8f9fa;
            height: 100%;
            width: 100%;
        }
    
        body {
            display: flex;
            min-height: 100vh;
        }
    
        .sidebar {
            width: 250px;
            background-color: #b82323;
            color: white;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: all 0.3s ease;
            position: relative;
        }
    
        .sidebar h2 {
            margin-bottom: 40px;
            font-size: 20px;
        }
    
        .sidebar a {
            text-decoration: none;
            color: white;
            font-size: 16px;
            margin: 10px 0;
            display: flex;
            align-items: center;
            padding: 10px;
            border-radius: 4px;
            transition: background-color 0.3s ease, color 0.3s ease;
        }
    
        .sidebar a:hover {
            background-color: #d9534f;
        }
    
        .sidebar .active {
            background-color: white;
            color: #b82323;
        }
    
        .sidebar .section {
            margin-bottom: 20px;
        }

        .sidebar .sections .section:not(:first-child) {
            border-top: 1px solid rgba(255, 255, 255, 0.3);
            padding-top: 20px;
            margin-top: 20px;
        }
    
        .sidebar .sections .section h3 {
            margin-bottom: 15px;
        }
    
        .icon {
            margin-right: 10px;
            width: 20px;
            text-align: center;
        }
    
        .sidebar a .fas {
            width: 20px;
        }
    
        .content {
            flex-grow: 1;
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: all 0.3s ease;
            overflow-y: auto;
        }
    
        h1 {
            font-size: 32px;
            margin-bottom: 30px;
            text-align: center;
            color: #333;
        }

        /* Chart Container */
        .chart-container {
            width: 80%;
            max-width: 800px;
            margin-top: 20px;
        }

        .chart-title {
            font-size: 24px;
            color: #333;
            text-align: center;
            margin-top: 10px;
            font-weight: 600;
        }
    </style>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const sidebarLinks = document.querySelectorAll('.sidebar a');
            sidebarLinks.forEach(link => {
                link.addEventListener('click', function () {
                    sidebarLinks.forEach(l => l.classList.remove('active'));
                    this.classList.add('active');
                });
            });

            // Sample data for sentiment analysis
            const feedbackComments = [
                { comment: "I kept encountering errors while submitting my vote.", sentiment: "Negative" },
                { comment: "Had a hard time navigating the website.", sentiment: "Negative" },
                { comment: "Great experience using the system!", sentiment: "Positive" },
                { comment: "Voting process was smooth and easy.", sentiment: "Positive" },
                { comment: "The website crashed multiple times.", sentiment: "Negative" },
                { comment: "The user interface is very confusing.", sentiment: "Negative" },
                { comment: "Well done! I was able to vote without any issues.", sentiment: "Positive" },
                { comment: "Some candidates' information was missing.", sentiment: "Neutral" },
                { comment: "Overall, it was a decent experience.", sentiment: "Neutral" },
                { comment: "The design is good, but it could be improved.", sentiment: "Neutral" }
            ];

            // Count sentiments
            const sentimentCounts = feedbackComments.reduce((counts, feedback) => {
                counts[feedback.sentiment] = (counts[feedback.sentiment] || 0) + 1;
                return counts;
            }, {});

            // Data for the chart
            const labels = Object.keys(sentimentCounts);
            const data = Object.values(sentimentCounts);

            // Render Chart
            const ctx = document.getElementById('sentimentChart').getContext('2d');
            new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Number of Comments',
                        data: data,
                        backgroundColor: ['#FF6384', '#36A2EB', '#FFCE56'],
                        borderWidth: 1
                    }]
                },
                options: {
                    responsive: true,
                    scales: {
                        y: {
                            beginAtZero: true
                        }
                    }
                }
            });
        });
    </script>
</head>

<body>
    <div class="sidebar">
        <div class="sections">
            <div class="section">
                <h2>SUSG COMELEC</h2>
                <a href="admin-liveresults.html"><i class="fas fa-chart-bar icon"></i>Live Results</a>
            </div>
            <div class="section">
                <h3>Management</h3>
                <a href="admin-voters.html"><i class="fas fa-user-friends icon"></i>Voters</a>
                <a href="admin-candidates.html"><i class="fas fa-user-tie icon"></i>Candidates</a>
            </div>
            <div class="section">
                <h3>Feedback</h3>
                <a href="admin-feedback.html"><i class="fas fa-comments icon"></i>View Feedback</a>  
            </div>
            <div class="section">
                <a href="admin-analytics.html" class="active"><i class="fas fa-chart-pie icon"></i>Analytics</a>
            </div>
            <div class="section">
                <a href="../start.html"><i class="fas fa-sign-out-alt icon"></i>Logout</a> <!-- Logout Section -->
            </div>
        </div>
    </div>

    <div class="content">
        <h1>Analytics</h1>
        <div class="chart-container">
            <h2 class="chart-title">Sentiment Analysis of Feedback Comments</h2>
            <canvas id="sentimentChart"></canvas>
        </div>
    </div>
</body>
</html>
