<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Candidates - SUSG Election System</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
    
        body,
        html {
            font-family: 'Poppins', sans-serif;
            background-color: #f8f9fa;
            height: 100%;
            width: 100%;
        }
    
        body {
            display: flex;
            min-height: 100vh;
        }
    
        .sidebar {
            width: 250px;
            background-color: #b82323;
            color: white;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: all 0.3s ease;
            position: relative;
        }
    
        .sidebar h2 {
            margin-bottom: 40px;
            font-size: 20px;
        }
    
        .sidebar a {
            text-decoration: none;
            color: white;
            font-size: 16px;
            margin: 10px 0;
            display: flex;
            align-items: center;
            padding: 10px;
            border-radius: 4px;
            transition: background-color 0.3s ease, color 0.3s ease;
        }
    
        .sidebar a:hover {
            background-color: #d9534f;
        }
    
        .sidebar .active {
            background-color: white;
            color: #b82323;
        }
    
        .sidebar .section {
            margin-bottom: 20px;
        }

        .sidebar .sections .section:not(:first-child) {
            border-top: 1px solid rgba(255, 255, 255, 0.3);
            padding-top: 20px;
            margin-top: 20px;
        }
    
        .sidebar .sections .section h3 {
            margin-bottom: 15px;
        }
    
        .icon {
            margin-right: 10px;
            width: 20px;
            text-align: center;
        }
    
        .sidebar a .fas {
            width: 20px;
        }
    
        .content {
            flex-grow: 1;
            padding: 40px;
            display: flex;
            flex-direction: column;
            transition: all 0.3s ease;
            overflow-y: auto;
        }
    
        h1 {
            font-size: 32px;
            margin-bottom: 30px;
            text-align: left;
            color: #333;
        }

        /* Management CSS */
        .mngment-box {
            background-color: #fff;
            border-radius: 10px;
            padding: 30px 20px;
            width: 95%;
            max-width: 3000px;
            margin-bottom: 40px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        .mngment-title {
            font-size: 28px;
            font-weight: 600;
            color: #333;
            margin-bottom: 20px;
        }

        .divider {
            border: 1px solid #e0e0e0;
            width: 90%;
            margin: 20px auto 30px auto;
        }

        .mngment-table {
            width: 100%;
            border-collapse: collapse;
            margin: 0 auto;
            width: 90%;
            font-size: 17px;
            flex-direction: column;
            text-align: left;
        }

        .mngment-table tr {
            border-bottom: 1px solid #cfcfcf;
        }
        .mngment-table th {
            font-size: 20px;
            padding: 15px 5px;
        }
        .mngment-table td {
            padding: 10px; 
        }

        /* Buttons */
        .add-btn{
            padding: 8px 12px;
            border: none;
            cursor: pointer;
            font-size: 17px;
            border-radius: 4px;
            background-color: #b82323; 
            color: white;
            width: 200px;
            float: right;
            margin: 10px;
        }

        .edit-btn, .delete-btn {
            padding: 8px 12px;
            border: none;
            cursor: pointer;
            font-size: 15px;
            border-radius: 4px;
        }

        .edit-btn {
            background-color: #4CAF50; 
            color: white;
        }

        .delete-btn {
            background-color: #f44336; 
            color: white;
        }

        .edit-btn:hover, .delete-btn:hover {
            opacity: 0.8;
        }
    
        @media (max-width: 1024px) {
            .sidebar {
                width: 200px;
            }
    
            h1 {
                font-size: 36px;
            }
        }
    
        @media (max-width: 768px) {
            body {
                flex-direction: column;
            }
    
            .sidebar {
                width: 100%;
                flex-direction: row;
                justify-content: space-between;
                align-items: center;
                padding: 10px 20px;
            }
    
            .sidebar .sections {
                display: none;
                flex-direction: column;
                width: 100%;
                background-color: #b82323;
                position: absolute;
                top: 60px;
                left: 0;
                padding: 20px;
                z-index: 1000;
            }
    
            .sidebar.active .sections {
                display: flex;
            }
    
            .toggle-button {
                display: block;
                cursor: pointer;
            }
    
            .content {
                padding: 20px;
            }
    
            .results-box,
            .election-countdown {
                width: 100%;
                padding: 20px;
            }
    
            .countdown-box {
                flex-direction: column;
                gap: 10px;
            }
        }
    
        @media (max-width: 480px) {
            h1 {
                font-size: 24px;
            }
    
            .results-title {
                font-size: 20px;
            }
    
            .percentage {
                font-size: 16px;
                padding: 8px;
                min-width: 40px;
            }
    
            .countdown-title {
                font-size: 20px;
            }
    
            .countdown-box {
                font-size: 18px;
            }
    
            .dropdown select {
                width: 100%;
            }
        }
    
        .toggle-button {
            display: none;
            font-size: 24px;
        }
    </style>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const toggleButton = document.createElement('div');
            toggleButton.classList.add('toggle-button');
            toggleButton.innerHTML = '<i class="fas fa-bars"></i>';
            document.querySelector('.sidebar').insertBefore(toggleButton, document.querySelector('.sidebar').firstChild);

            toggleButton.addEventListener('click', function () {
                document.querySelector('.sidebar').classList.toggle('active');
            });
            const sidebarLinks = document.querySelectorAll('.sidebar a');
            sidebarLinks.forEach(link => {
                link.addEventListener('click', function () {
                    sidebarLinks.forEach(l => l.classList.remove('active'));
                    this.classList.add('active');
                });
            });
        });
    </script>
</head>

<body>
    <div class="sidebar">
        <div class="toggle-button">
            <i class="fas fa-bars"></i>
        </div>
        <div class="sections">
            <div class="section">
                <h2>SUSG COMELEC</h2>
                <a href="admin-liveresults.html"><i class="fas fa-chart-bar icon"></i>Live Results</a>
            </div>
            <div class="section">
                <h3>Management</h3>
                <a href="admin-voters.html"><i class="fas fa-user-friends icon"></i>Voters</a>
                <a href="admin-candidates.html"><i class="fas fa-user-tie icon"></i>Candidates</a>
            </div>
            <div class="section">
                <h3>Feedback</h3>
                <a href="admin-feedback.html"><i class="fas fa-comments icon"></i>View Feedback</a>  
            </div>
            <div class="section">
                <a href="admin-analytics.html"><i class="fas fa-chart-pie icon"></i>Analytics</a>
            </div>
        </div>
    </div>

    <div class="content">
        <h1>Candidates</h1>
        <button class="add-btn">File new candidacy</button>
        <div class="mngment-box">
            <table class="mngment-table">
                <thead>
                    <tr>
                        <th>Candidate Name</th>
                        <th>Party</th>
                        <th>Position</th>
                        <th>Edit</th>
                        <th>Delete</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>Candidate A</td>
                        <td>Friday</td>
                        <td>President</td>
                        <td>
                            <button class="edit-btn">Edit</button>
                        </td>
                        <td>
                            <button class="delete-btn">Delete</button>
                        </td>
                    </tr>
                    <tr>
                        <td>Candidate B</td>
                        <td>Tuesday</td>
                        <td>President</td>
                        <td>
                            <button class="edit-btn">Edit</button>
                        </td>
                        <td>
                            <button class="delete-btn">Delete</button>
                        </td>
                    </tr>
                    <tr>
                        <td>Candidate C</td>
                        <td>Saturday</td>
                        <td>Vice-President</td>
                        <td>
                            <button class="edit-btn">Edit</button>
                        </td>
                        <td>
                            <button class="delete-btn">Delete</button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        
    </div>
</body>

</html>
