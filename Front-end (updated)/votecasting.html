<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SUSG Election System - Vote Casting</title>

    <!-- Link to external CSS -->
    <link rel="stylesheet" href="cssscript/votecastingstyle.css">
    <script src="script/load.js" type="module" defer></script>
</head>


<body>
    
    <header id="header">
    </header>

    <main class="vote-casting-container">
        <h1 class="title">Vote Casting</h1>

        <div class="voting-box">
            <h2 class="position-title">Voting for SUSG (PositionName)</h2>
            <hr class="divider">
            <div class="candidates">
                <div class="candidate-card">
                    <div class="candidate-photo"></div>
                    <h3 class="candidate-name">Rynz Daval President</h3>
                    <p class="candidate-party">Tribu Wakwak</p>
                    <button class="vote-btn">Vote</button>
                </div>
                <div class="candidate-card">
                    <div class="candidate-photo"></div>
                    <h3 class="candidate-name">Daniel Ray Cal President</h3>
                    <p class="candidate-party">Tribu Akro</p>
                    <button class="vote-btn">Vote</button>
                </div>
                <div class="candidate-card">
                    <div class="candidate-photo"></div>
                    <h3 class="candidate-name">James Ald Teves President</h3>
                    <p class="candidate-party">Tribu  Apokalipto</p>
                    <button class="vote-btn">Vote</button>
                </div>
            </div>
        </div>

        <div class="navigation-buttons">
            <button class="nav-btn back-btn">Back</button>
            <button class="nav-btn abstain-btn">Abstain</button>
            <button class="nav-btn next-btn">Next</button>
        </div>
    </main>

    <footer id="footer">
    </footer>

</body>

</html>
