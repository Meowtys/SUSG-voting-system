<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SUSG Election System</title>
    <link rel="stylesheet" href="voter-homepage.css">
</head>
<body>
    <!-- Navigation Bar -->
    <nav>
        <div class="nav-left">
            <h1>SUSG Election System</h1>
        </div>
        <div class="nav-right">
            <button>Login</button>
            <button>Register</button>
        </div>
    </nav>

    <!-- User Account Profile -->
    <section class="profile">
        <div class="profile-info">
            <h2>Miles Morales</h2>
            <p class="profile-id">Student ID: 20-3-071203</p>
            <p class="profile-college">College of Engineering</p>
            <p class="profile-status">Voting Status: Eligible</p>
        </div>
    </section>

    <!-- Main Content -->
    <main>
        <div class="panel panel1">
            <h2>Panel 1</h2>
            <p>Information about the election process or announcements.</p>
            <button class="panel-button">Vote Now</button>
        </div>
        <div class="panel panel2">
            <h2>Panel 2</h2>
            <p>Details about candidates or upcoming events.</p>
            <button class="panel-button">Tally</button>
        </div>
    </main>

    <!-- Footer -->
    <footer>
        <p>&copy; 2024 SUSG Election System. All rights reserved.</p>
    </footer>
