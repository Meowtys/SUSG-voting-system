<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Voters - SUSG Election System</title>
    <link rel="icon" href="../asset/susglogo.png" type="image/png">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            font-family: 'Poppins', sans-serif;
            background-color: #f8f9fa;
            height: 100%;
            width: 100%;
        }

        body {
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: 250px;
            background-color: #b82323;
            color: white;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .sidebar h2 {
            margin-bottom: 40px;
            font-size: 20px;
        }

        .sidebar a {
            text-decoration: none;
            color: white;
            font-size: 16px;
            margin: 10px 0;
            display: flex;
            align-items: center;
            padding: 10px;
            border-radius: 4px;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .sidebar a:hover {
            background-color: #d9534f;
        }

        .content {
            flex-grow: 1;
            padding: 40px;
            overflow-y: auto;
        }

        h1 {
            font-size: 32px;
            margin-bottom: 30px;
            text-align: left;
            color: #333;
        }

        .mngment-box {
            background-color: #fff;
            border-radius: 10px;
            padding: 30px 20px;
            width: 95%;
            max-width: 3000px;
            margin-bottom: 40px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        .mngment-table {
            width: 90%;
            border-collapse: collapse;
            margin: 0 auto;
            font-size: 17px;
            text-align: left;
        }

        .mngment-table th, .mngment-table td {
            padding: 10px;
            border-bottom: 1px solid #cfcfcf;
        }

        .edit-btn, .delete-btn {
            padding: 8px 12px;
            border: none;
            cursor: pointer;
            font-size: 15px;
            border-radius: 4px;
        }

        .edit-btn {
            background-color: #4CAF50;
            color: white;
        }

        .delete-btn {
            background-color: #f44336;
            color: white;
        }

        .edit-btn:hover, .delete-btn:hover {
            opacity: 0.8;
        }

        .sidebar .active {
            background-color: white;
            color: #b82323;
        }
    </style>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const votersData = [
                { id: "21-1-0001", name: "Juan Dela Cruz", department: "CCS" },
                { id: "22-1-0002", name: "Johnny Smith", department: "CAS" },
                { id: "24-1-0003", name: "David Salon", department: "CBA" },
                { id: "20-1-0004", name: "Dinosaur King", department: "CED" },
                { id: "21-1-0955", name: "Joanna Lopez", department: "CCS" },
                { id: "23-1-0090", name: "Maria Santos", department: "CAS" },
                { id: "20-1-0456", name: "Pedro Cruz", department: "ENG" },
                { id: "19-2-0321", name: "Anna Garcia", department: "NURSING" },
                { id: "22-3-0112", name: "Eddie Bautista", department: "LAW" },
                { id: "21-4-0147", name: "Lara Rodriguez", department: "MED" },
                { id: "23-1-0009", name: "Kyle Ortega", department: "CAS" },
                { id: "24-2-0342", name: "Cindy Lim", department: "ENG" },
                { id: "22-1-0567", name: "Mark Tan", department: "CCS" },
                { id: "20-1-0890", name: "Stephanie Yee", department: "CBA" },
                { id: "21-2-0678", name: "Carlos Perez", department: "CAS" },
                { id: "24-1-0785", name: "Sandy Ong", department: "NURSING" },
                { id: "22-1-0454", name: "Tommy Chang", department: "LAW" },
                { id: "23-2-0345", name: "Diane Nolasco", department: "CCS" },
                { id: "21-3-0123", name: "Rico Martinez", department: "MED" },
                { id: "22-1-0765", name: "Patricia Wu", department: "CED" }
            ];

            const tableBody = document.querySelector(".mngment-table tbody");

            function renderTable() {
                tableBody.innerHTML = "";
                votersData.forEach((voter, index) => {
                    const row = document.createElement("tr");
                    row.innerHTML = `
                        <td>${voter.id}</td>
                        <td contenteditable="false">${voter.name}</td>
                        <td contenteditable="false">${voter.department}</td>
                        <td><button class="edit-btn" onclick="editVoter(${index})">Edit</button></td>
                        <td><button class="delete-btn" onclick="deleteVoter(${index})">Delete</button></td>
                    `;
                    tableBody.appendChild(row);
                });
            }

            window.editVoter = function (index) {
                const row = tableBody.rows[index];
                const nameCell = row.cells[1];
                const departmentCell = row.cells[2];
                const editButton = row.cells[3].querySelector(".edit-btn");

                if (editButton.textContent === "Edit") {
                    nameCell.contentEditable = "true";
                    departmentCell.contentEditable = "true";
                    editButton.textContent = "Save";
                    nameCell.focus();
                } else {
                    nameCell.contentEditable = "false";
                    departmentCell.contentEditable = "false";
                    editButton.textContent = "Edit";

                    // Save updated data back to the array
                    votersData[index].name = nameCell.textContent.trim();
                    votersData[index].department = departmentCell.textContent.trim();
                }
            };

            window.deleteVoter = function (index) {
                if (confirm("Are you sure you want to delete this voter?")) {
                    votersData.splice(index, 1);
                    renderTable();
                }
            };

            renderTable();
        });
    </script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
        const sidebarLinks = document.querySelectorAll('.sidebar a');

        // Remove 'active' class from all links
        sidebarLinks.forEach(link => link.classList.remove('active'));

        // Set 'active' class based on current URL
        sidebarLinks.forEach(link => {
            if (link.href === window.location.href) {
                link.classList.add('active');
            }
        });
    });
    </script>
</head>

<body>
    <div class="sidebar">
        <div class="sections">
            <div class="section">
                <h2>SUSG COMELEC</h2>
                <a href="admin-liveresults.html"><i class="fas fa-chart-bar icon"></i>Live Results</a>
            </div>
            <div class="section">
                <h3>Management</h3>
                <a href="admin-voters.html" class="active"><i class="fas fa-user-friends icon"></i>Voters</a>
                <a href="admin-candidates.html"><i class="fas fa-user-tie icon"></i>Candidates</a>
            </div>
            <div class="section">
                <h3>Feedback</h3>
                <a href="admin-feedback.html"><i class="fas fa-comments icon"></i>View Feedback</a>  
            </div>
            <div class="section">
                <a href="admin-analytics.html"><i class="fas fa-chart-pie icon"></i>Analytics</a>
            </div>
            <div class="section">
                <a href="../start.html"><i class="fas fa-sign-out-alt icon"></i>Logout</a> <!-- Logout Section -->
            </div>
        </div>
    </div>

    <div class="content">
        <h1>Voters</h1>
        <div class="mngment-box">
            <table class="mngment-table">
                <thead>
                    <tr>
                        <th>SU ID</th>
                        <th>Name</th>
                        <th>Department</th>
                        <th>Edit</th>
                        <th>Delete</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Data will be rendered here by JavaScript -->
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
